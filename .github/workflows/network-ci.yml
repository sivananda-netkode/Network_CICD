name: Network CI

on:
  push:
    branches:
      - master

jobs:
  test:
    name: Run Network Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest
